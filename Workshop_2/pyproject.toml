[project]
name = "fashion-mnist-dl"
version = "0.2.0"
description = "Workshop 2 - Deep learning models for Fashion-MNIST image classification"
requires-python = ">=3.11, <3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.4,<2",
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "tensorboard>=2.16,<3",
    "tqdm>=4.66,<5",
    "ipykernel>=6.29,<7",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
