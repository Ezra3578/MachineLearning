[project]
name = "team3-workshop4"
version = "0.1.0"
description = "Workshop 4 — Autoencoders & Variational Autoencoders for Fashion-MNIST"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "umap-learn>=0.5.5",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "tensorboard>=2.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
